name: weekly-search

on:
  schedule:
    # Thursday 10:17 Europe/Istanbul. Public technical checks only.
    - cron: '17 7 * * 4'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-public-search
  cancel-in-progress: false

jobs:
  public-search:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify reporting tools
        run: node --test tests/search-tools.test.mjs tests/search-priorities.test.mjs
      - name: Audit the public website
        id: crawl
        continue-on-error: true
        run: node scripts/search-audit.mjs --site https://www.yikat.tech --concurrency 3 --max-pages 250 --out output/weekly-search/audit
      - name: Prepare the decision queue
        if: always()
        run: node scripts/search-priorities.mjs --audit output/weekly-search/audit/audit.json --out output/weekly-search/priorities
      - name: Publish the public summary
        if: always()
        run: cat output/weekly-search/priorities/priorities.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-search-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/weekly-search/
          retention-days: 30
          if-no-files-found: error
      - name: Require complete technical evidence
        if: steps.crawl.outcome != 'success'
        run: exit 1
